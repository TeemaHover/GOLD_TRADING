[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xaubot"
version = "0.1.0"
description = "Production ML trading system for XAUUSD (5m execution, multi-timeframe context)"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "pydantic>=2.7",
    "pyyaml>=6",
    "typer>=0.12",
    "rich>=13",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
ml = [
    "torch>=2.4",
    "scikit-learn>=1.5",
    "lightgbm>=4.3",
    "optuna>=3.6",
    "shap>=0.45",
]
db = ["sqlalchemy>=2.0", "alembic>=1.13"]
service = ["fastapi>=0.111", "uvicorn>=0.30", "dash>=2.17", "plotly>=5.22"]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
xaubot = "xaubot.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: tests that take more than a few seconds",
    "leakage: look-ahead / data-leakage guard tests",
]
filterwarnings = ["error::FutureWarning"]

[tool.ruff]
# 110 rather than 88/100: most overruns here are log messages and diagnostic
# strings, and wrapping those makes them harder to grep for.
line-length = 110
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PTH", "RET", "SIM", "ARG", "PD", "NPY", "RUF"]
ignore = ["B008"]  # B008: typer uses Option()/Argument() defaults by design

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "PD"]
# PD011 flags `.values`, assuming it is the deprecated DataFrame accessor.
# `FeatureMatrix.values` is our own dataclass field holding the feature frame.
"src/xaubot/features/engine.py" = ["PD011"]
"src/xaubot/features/pit_audit.py" = ["PD011"]
"src/xaubot/features/store.py" = ["PD011"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
disallow_any_generics = false
plugins = []

[[tool.mypy.overrides]]
module = ["pyarrow.*", "yaml.*"]
ignore_missing_imports = true
